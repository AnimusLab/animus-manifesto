name: Anchor Compliance Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  anchor-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install anchor-audit

    - name: Run Anchor Governance Scan
      env:
        ANCHOR_CONSTITUTION_URL: https://raw.githubusercontent.com/AnimusLab/Anchor/main/anchor/governance/constitution.anchor
        ANCHOR_MITIGATION_URL: https://raw.githubusercontent.com/AnimusLab/Anchor/main/anchor/governance/mitigation.anchor
        ANCHOR_GOVERNANCE_LOCK_URL: https://raw.githubusercontent.com/AnimusLab/Anchor/main/anchor/governance/GOVERNANCE.lock
      run: |
        anchor check . --verbose
